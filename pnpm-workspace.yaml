packages:
  - apps/*
  # its own npm lockfile (apps/obsidian/package-lock.json): keeps pnpm-lock.yaml unchanged
  - "!apps/obsidian"

# The same install scripts npm ran for captions-app: native binaries
# (esbuild, sharp, onnxruntime-node, fsevents, protobufjs) and the
# Chromium that export rendering drives.
onlyBuiltDependencies:
  - esbuild
  - fsevents
  - onnxruntime-node
  - playwright-chromium
  - protobufjs
  - sharp

# Lets `pnpm deploy` build a production node_modules from pnpm-lock.yaml
# (without it, deploy re-resolves and pulls newer versions).
injectWorkspacePackages: true

# kokoro-js (the assistant's read-aloud voice) asks for transformers 3; it runs on the app's own 4, so there's one copy
overrides:
  kokoro-js>@huggingface/transformers: ^4.2.0
