<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b10" />
    <script>
      (function () {
        var share = /^\/(clips|documents)\/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\/?$/i.test(location.pathname);
        // the app is drawn dark; a share page takes the stored choice (Settings → Appearance), nothing stored = the system's
        var dark = true;
        if (share) {
          try {
            var stored = localStorage.getItem("share-theme");
            dark = stored === "light" ? false : stored === "dark" ? true : matchMedia("(prefers-color-scheme: dark)").matches;
          } catch (e) {
            dark = matchMedia("(prefers-color-scheme: dark)").matches;
          }
        }
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#0b0b10" : "#fafafa");
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Creator Toolset" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <title>Creator Toolset</title>
    <base href="/" />
  </head>

</html>
