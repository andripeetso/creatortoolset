<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b10" />
    <script>
      (function () {
        var path = location.pathname;
        // a public share page: caption/document links, Review/Finals/Workshop links (AuthGate)
        var share = /^\/(clips|documents)\/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\/?$/i.test(path) || /^\/(r|rp|fs|ws|library\/s)\//.test(path);
        // the stored choice (Settings → Appearance); nothing stored = the system's look, in the app and on a share page
        var system = matchMedia("(prefers-color-scheme: dark)").matches;
        var stored = null;
        try { stored = localStorage.getItem("share-theme"); } catch (e) {}
        var dark = stored === "light" ? false : stored === "dark" ? true : system;
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#0b0b10" : "#fafafa");
        // the last project's colour (useRootTint keeps it), so a reload never flashes violet first
        var tint = null;
        try { tint = localStorage.getItem("ct-tint"); } catch (e) {}
        if (tint && !share) document.documentElement.dataset.tint = tint;
        // a colour of the person's own (Settings → Appearance → Custom): its variables, as useRootTint saved them
        if (tint === "custom" && !share) {
          var own = null;
          try { own = localStorage.getItem("ct-tint-css"); } catch (e) {}
          if (own) {
            var st = document.createElement("style");
            st.id = "ct-custom-tint";
            st.textContent = own;
            document.head.appendChild(st);
          }
        }
      })();
    </script>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024'%3E%3Cdefs%3E%3CradialGradient id='g' cy='.46'%3E%3Cstop offset='0' stop-color='%234A28D0'/%3E%3Cstop offset='1' stop-color='%230C0818'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='1024' height='1024' rx='230' fill='url(%23g)'/%3E%3Cg fill='%23fff' transform='translate(-28 0)'%3E%3Cpath d='M440 285A235 235 0 1 0 610 682' fill='none' stroke='%23fff' stroke-width='130'/%3E%3Crect x='438' y='220' width='500' height='130'/%3E%3Crect x='690' y='220' width='128' height='600'/%3E%3C/g%3E%3C/svg%3E" />
    <title>Creator Toolset</title>
    <base href="/" />
  </head>
  <body>
    <div id="root"></div>
    <!-- the CT mark draws itself until the app first draws into #root (it lives outside #root, so the Mac app's
         10 s "still blank" check keeps seeing an empty #root); the same mark as the Mac app's splashPage -->
    <div id="ct-boot" role="status" aria-label="Opening Creator Toolset">
      <svg viewBox="111 120 800 800" aria-hidden="true">
        <linearGradient id="ct-boot-g" gradientUnits="userSpaceOnUse" x1="0" y1="200" x2="0" y2="840"><stop offset="0" /><stop offset="1" /></linearGradient>
        <g stroke="url(#ct-boot-g)">
          <path class="s c" pathLength="1" d="M412 285A235 235 0 1 0 582 682" stroke-width="130" />
          <path class="s b" pathLength="1" d="M410 285H910" stroke-width="130" />
          <path class="s t" pathLength="1" d="M726 350V820" stroke-width="128" />
        </g>
      </svg>
    </div>
    <style>
      #ct-boot{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;animation:ct-boot-show .3s ease .25s forwards}
      #root:not(:empty)~#ct-boot{display:none}
      #ct-boot svg{width:120px;height:120px;overflow:visible}
      #ct-boot stop:first-child{stop-color:#4a28d0} #ct-boot stop:last-child{stop-color:#8b6cff}
      .dark #ct-boot stop:first-child{stop-color:#ece7ff} .dark #ct-boot stop:last-child{stop-color:#b3a1ff}
      #ct-boot .s{fill:none;stroke-dasharray:1 1;stroke-dashoffset:1;animation:ct-boot-draw .5s cubic-bezier(.3,0,.2,1) .25s forwards}
      #ct-boot .c{animation-duration:.65s} #ct-boot .b{animation-delay:.75s} #ct-boot .t{animation-delay:1s}
      @keyframes ct-boot-draw{to{stroke-dashoffset:0}} @keyframes ct-boot-show{to{opacity:1}}
      @media (prefers-reduced-motion:reduce){#ct-boot .s{animation:none;stroke-dashoffset:0}}
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
